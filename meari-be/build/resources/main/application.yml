server:
  port: 8081
  servlet: # 업로드되는 파일 용량 제한 해제
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    org:
      springframework:
        transaction: DEBUG
        # WebSocket & STOMP 로그 추가
        messaging: DEBUG
        web:
          socket: DEBUG
    com:
      ssafy: debug

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

spring:
  application:
    name: meari-be
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/meari_db # DB 이름 확인 필요
    username: ssafy
    password: ${DB_PASSWORD} # Jenkins/Docker 배포 시 환경변수 필요

  jpa:
    hibernate:
      ddl-auto: update # 개발 단계에서는 update, 운영은 none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost # 배포 시 변경 필요
      port: 6380

jwt:
  secret-key: 6e1c9d2b8f7a5c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d
  access-token-expire-period: 43200000
  refresh-token-expire-period: 1209600000

frontend:
  url: "http://127.0.0.1:5173"  # 프론트엔드 URL


