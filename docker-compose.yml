version: '3.8'

services:
  # ============================================================
  # 1. PostgreSQL - 메인 데이터베이스
  # ============================================================
  postgres:
    image: postgres:15-alpine
    container_name: meari-postgres
    environment:
      POSTGRES_USER: ssafy
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: meari_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - meari-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1.5G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ssafy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # 2. Redis - 패스워드 유무에 상관없이 돌아가도록 수정됨
  # ============================================================
  redis:
    image: redis:alpine
    container_name: meari-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    # 패스워드가 없어도 문법 에러가 나지 않도록 처리
    command: >
      sh -c "redis-server --save 60 1 --loglevel warning ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}"
    networks:
      - meari-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      # 패스워드가 있으면 인증하고, 없으면 그냥 ping 체크
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a $REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # 3. RabbitMQ - 메시지 브로커
  # ============================================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: meari-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ssafy
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - meari-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # 4. OpenVidu CE Platform 2.32.1 - WebRTC 미디어 서버
  # ============================================================

  # 4-1. OpenVidu Server
  openvidu-server:
    image: openvidu/openvidu-server:2.32.1
    container_name: meari-openvidu-server
    restart: on-failure
    networks:
      - meari-network
    entrypoint: ['/usr/local/bin/entrypoint.sh']
    volumes:
      - ./openvidu/coturn:/run/secrets/coturn
      - /var/run/docker.sock:/var/run/docker.sock
      - ${OPENVIDU_RECORDING_PATH}:${OPENVIDU_RECORDING_PATH}
      - ${OPENVIDU_RECORDING_CUSTOM_LAYOUT}:${OPENVIDU_RECORDING_CUSTOM_LAYOUT}
      - ${OPENVIDU_CDR_PATH}:${OPENVIDU_CDR_PATH}
    environment:
      - SERVER_SSL_ENABLED=false
      - SERVER_PORT=5443
      - KMS_URIS=["ws://kms:8888/kurento"]
      - COTURN_IP=${COTURN_IP:-auto-ipv4}
      - COTURN_PORT=${COTURN_PORT:-3478}
      - OPENVIDU_SECRET=${OPENVIDU_SECRET}
    ports:
      - "5443:5443"
    logging:
      options:
        max-size: "${DOCKER_LOGS_MAX_SIZE:-100M}"
    deploy:
      resources:
        limits:
          memory: 2G

  # 4-2. Kurento Media Server
  kms:
    image: ${KMS_IMAGE:-kurento/kurento-media-server:7.3.0}
    container_name: meari-kms
    restart: always
    networks:
      - meari-network
    ulimits:
      core: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - /opt/openvidu/kms-crashes:/opt/openvidu/kms-crashes
      - ${OPENVIDU_RECORDING_PATH}:${OPENVIDU_RECORDING_PATH}
      - /opt/openvidu/kurento-logs:/opt/openvidu/kurento-logs
    environment:
      - KMS_MIN_PORT=40000
      - KMS_MAX_PORT=57000
      - GST_DEBUG=${KMS_DOCKER_ENV_GST_DEBUG:-}
      - KURENTO_LOG_FILE_SIZE=${KMS_DOCKER_ENV_KURENTO_LOG_FILE_SIZE:-100}
      - KURENTO_LOGS_PATH=/opt/openvidu/kurento-logs
    ports:
      - "8888:8888"
      - "40000-57000:40000-57000/udp"
    logging:
      options:
        max-size: "${DOCKER_LOGS_MAX_SIZE:-100M}"
    deploy:
      resources:
        limits:
          memory: 2G

  # 4-3. COTURN (TURN/STUN Server)
  coturn:
    image: openvidu/openvidu-coturn:2.32.1
    container_name: meari-coturn
    restart: on-failure
    networks:
      - meari-network
    ports:
      - "${COTURN_PORT:-3478}:${COTURN_PORT:-3478}/tcp"
      - "${COTURN_PORT:-3478}:${COTURN_PORT:-3478}/udp"
      - "${COTURN_MIN_PORT:-57001}-${COTURN_MAX_PORT:-65535}:${COTURN_MIN_PORT:-57001}-${COTURN_MAX_PORT:-65535}/udp"
    volumes:
      - ./openvidu/coturn:/run/secrets/coturn
    command:
      - --log-file=stdout
      - --listening-port=${COTURN_PORT:-3478}
      - --fingerprint
      - --min-port=${COTURN_MIN_PORT:-57001}
      - --max-port=${COTURN_MAX_PORT:-65535}
      - --realm=openvidu
      - --verbose
      - --use-auth-secret
      - --static-auth-secret=${COTURN_SHARED_SECRET_KEY}
    logging:
      options:
        max-size: "${DOCKER_LOGS_MAX_SIZE:-100M}"
    deploy:
      resources:
        limits:
          memory: 512M

  # ============================================================
  # 5. Frontend (Nginx + React)
  # ============================================================
  frontend:
    container_name: meari-frontend
    image: frontend-image:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - meari-network
    restart: always
    depends_on:
      - spring-api

  # ============================================================
  # 6. Spring Boot API - 메인 백엔드 서버.
  # ============================================================
  spring-api:
    image: backend-image:latest
    container_name: meari-spring
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/meari_db
      SPRING_DATASOURCE_USERNAME: ssafy
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ssafy
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      OPENVIDU_URL: http://openvidu-server:5443
      OPENVIDU_SECRET: ${OPENVIDU_SECRET}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ACCESS_TOKEN_EXPIRE_PERIOD: ${JWT_ACCESS_TOKEN_EXPIRE_PERIOD}
      JWT_REFRESH_TOKEN_EXPIRE_PERIOD: ${JWT_REFRESH_TOKEN_EXPIRE_PERIOD}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL}
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_REGION: ${AWS_REGION}
      CLOUD_AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      CLOUD_AWS_REGION_STATIC: ${AWS_REGION}
      CLOUD_AWS_CREDENTIALS_ACCESS_KEY: ${AWS_ACCESS_KEY}
      CLOUD_AWS_CREDENTIALS_SECRET_KEY: ${AWS_SECRET_KEY}
      CLOUD_AWS_PRESIGNED_URL_VIDEO_EXPIRATION: 3600
      CLOUD_AWS_PRESIGNED_URL_UPLOAD_EXPIRATION: 900
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "true"
    ports:
      - "8080:8080"
    networks:
      - meari-network
    #depends_on:
    #   - openvidu
    #      postgres:
    #        condition: service_healthy
    #      redis:
    #        condition: service_healthy
    #      rabbitmq:
    #        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G

  # ============================================================
  # 7. FastAPI - AI 분석 서버 (환경변수 대응 수정됨)
  # ============================================================
  fastapi:
    image: meari-fastapi:latest
    container_name: meari-fastapi
    environment:
      DATABASE_URL: postgresql://ssafy:${DB_PASSWORD}@postgres:5432/meari_db
      REDIS_URL: "redis://${REDIS_PASSWORD:+:$REDIS_PASSWORD@}redis:6379"
      RABBITMQ_URL: amqp://ssafy:${RABBITMQ_PASSWORD}@rabbitmq:5672
    ports:
      - "8000:8000"
    networks:
      - meari-network
    #    depends_on:
    #      postgres:
    #        condition: service_healthy
    #      redis:
    #        condition: service_healthy
    #      rabbitmq:
    #        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G

# ============================================================
# 네트워크 및 볼륨 설정
# ============================================================
networks:
  meari-network:
    name: meari-network
    driver: bridge

volumes:
  jenkins_home:
  postgres_data:
  redis_data:
  rabbitmq_data:
  openvidu_recordings:
  openvidu_config:
