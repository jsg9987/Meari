version: '3.8'

services:
  # ============================================================
  # Jenkins - CI/CD 서버 (localhost:9090만 접근 가능)
  # ============================================================
#  jenkins:
#    image: jenkins/jenkins:lts
#    container_name: meari-jenkins
#    user: root
#    ports:
#      - "127.0.0.1:9090:8080"   # localhost에서만 접근
#      - "127.0.0.1:50000:50000" # Jenkins 에이전트
#    volumes:
#      - jenkins_home:/var/jenkins_home
#      - /var/run/docker.sock:/var/run/docker.sock  # Docker 명령어 사용
#    environment:
#      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
#      - TZ=Asia/Seoul
#    networks:
#      - meari-network
#    restart: unless-stopped
#    deploy:
#      resources:
#        limits:
#          memory: 2G

  # ============================================================
  # 1. PostgreSQL - 메인 데이터베이스
  # ============================================================
  postgres:
    image: postgres:15-alpine
    container_name: meari-postgres
    environment:
      POSTGRES_USER: ssafy
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: meari_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - meari-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1.5G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ssafy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # 2. Redis - 캐시 및 세션 관리
  # ============================================================
  redis:
    image: redis:alpine
    container_name: meari-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning --requirepass ${REDIS_PASSWORD}
    networks:
      - meari-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # 3. RabbitMQ - 메시지 브로커
  # ============================================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: meari-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ssafy
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - meari-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # 4. OpenVidu - WebRTC 미디어 서버
  # ============================================================
  openvidu:
    image: openvidu/openvidu-dev:2.29.0
    container_name: meari-openvidu
    environment:
      OPENVIDU_SECRET: ${OPENVIDU_SECRET}
      DOMAIN_OR_PUBLIC_IP: ${OPENVIDU_DOMAIN}
      HTTPS_PORT: 4443
      HTTP_PORT: 4442
    ports:
      - "4443:4443"
      - "4442:4442"
      - "3478:3478"
      - "40000-57000:40000-57000/tcp"
      - "40000-57000:40000-57000/udp"
    volumes:
      - openvidu_recordings:/opt/openvidu/recordings
      - openvidu_config:/opt/openvidu/config
    networks:
      - meari-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G

  # ============================================================
  # 5. Frontend (Nginx + React)
  # ============================================================
  frontend:
    container_name: meari-frontend
    image: frontend-image:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - meari-network
    restart: always
    depends_on:
      - spring-api

  # ============================================================
  # 6. Spring Boot API - 메인 백엔드 서버
  # ============================================================
  spring-api:
    image: backend-image:latest
    container_name: meari-spring
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # PostgreSQL 연결 정보
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/meari_db
      SPRING_DATASOURCE_USERNAME: ssafy
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      # Redis 연결 정보
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD}
      # RabbitMQ 연결 정보
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ssafy
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      # OpenVidu 연결 정보
      OPENVIDU_URL: https://openvidu:4443
      OPENVIDU_SECRET: ${OPENVIDU_SECRET}
    ports:
      - "8080:8080"
    networks:
      - meari-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G

  # ============================================================
  # 7. FastAPI - AI 분석 서버
  # ============================================================
  fastapi:
    image: meari-fastapi:latest
    container_name: meari-fastapi
    environment:
      # PostgreSQL 연결 URL
      DATABASE_URL: postgresql://ssafy:${DB_PASSWORD}@postgres:5432/meari_db
      # Redis 연결 URL
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # RabbitMQ 연결 URL
      RABBITMQ_URL: amqp://ssafy:${RABBITMQ_PASSWORD}@rabbitmq:5672
    ports:
      - "8000:8000"
    networks:
      - meari-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G

# ============================================================
# 네트워크 설정
# ============================================================
networks:
  meari-network:
    driver: bridge
    # ipam 설정 제거 - Docker가 자동으로 충돌 없는 IP 할당

# ============================================================
# 볼륨 설정
# ============================================================
volumes:
  jenkins_home:
  postgres_data:
  redis_data:
  rabbitmq_data:
  openvidu_recordings:
  openvidu_config: